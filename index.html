<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#17110E">
<title>罗盘</title>
<style>
/* ══════════════════════════════════════
   1 · 设计变量
   ══════════════════════════════════════ */
:root{
  --lacquer:#17110E;
  --ivory:#EFE2C4;
  --ivory-dim:#D6C193;
  --cinnabar:#A32B1E;
  --gold:#B4903C;
  --brass:#E0BE6A;
}

/* ══════════════════════════════════════
   2 · 基础版式
   ══════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 34%, #2A1F17 0%, var(--lacquer) 62%);
  color:var(--ivory);
  font-family:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC",serif;
  overflow:hidden;touch-action:none;
}
[hidden]{display:none!important}

.act{
  height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(9px,2.2vh,18px);
  padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 14px);
}

/* ══════════════════════════════════════
   3 · 盘面
   ══════════════════════════════════════ */
.plate{
  position:relative;
  width:min(90vw,50vh);height:min(90vw,50vh);
  flex:0 0 auto;
}
.plate::after{                       /* 盘边木框 */
  content:"";position:absolute;inset:-2.4%;border-radius:50%;
  background:linear-gradient(150deg,#4A3524,#241812 55%,#3D2B1C);
  box-shadow:0 14px 40px rgba(0,0,0,.65), inset 0 0 0 1px rgba(224,190,106,.28);
  z-index:-1;
}
.plate.locked::after{
  box-shadow:0 14px 40px rgba(0,0,0,.65), inset 0 0 0 1.5px rgba(224,190,106,.75);
}
#dial{width:100%;height:100%;display:block;will-change:transform}

/* 倒数进度环：覆盖在盘上，不随盘转 */
.hud{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hud .track{fill:none;stroke:rgba(23,17,14,.22);stroke-width:5}
.hud .ring{fill:none;stroke:var(--brass);stroke-width:5;stroke-linecap:round;transition:stroke .25s}
.plate.tilted .hud .ring{stroke:var(--cinnabar)}

/* 天心十道：固定不动，代表手机所指 */
.threads{position:absolute;inset:0;pointer-events:none}
.threads i{position:absolute;background:rgba(224,190,106,.55)}
.threads .v{
  left:50%;top:-1.5%;bottom:-1.5%;width:1px;transform:translateX(-.5px);
  background:linear-gradient(180deg,var(--cinnabar) 0 46%,rgba(224,190,106,.5) 46%);
}
.threads .h{top:50%;left:-1.5%;right:-1.5%;height:1px;transform:translateY(-.5px)}
.cursor{
  position:absolute;left:50%;top:-3.6%;width:0;height:0;transform:translateX(-50%);
  border-left:8px solid transparent;border-right:8px solid transparent;
  border-top:13px solid var(--cinnabar);
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));
}

/* ══════════════════════════════════════
   4 · 倒数与读数
   ══════════════════════════════════════ */
.timer{
  display:flex;align-items:baseline;gap:.6em;min-height:1.4em;
  font-size:clamp(15px,4.4vw,19px);color:var(--ivory-dim);
  letter-spacing:.2em;text-indent:.2em;
}
.timer b{
  font-size:clamp(28px,8vw,40px);font-weight:500;letter-spacing:0;
  font-variant-numeric:tabular-nums;color:var(--brass);
}
.plate.tilted ~ .timer,
.plate.tilted ~ .timer b{color:var(--cinnabar)}

.readout{text-align:center;line-height:1.15}
.readout .deg{
  font-size:clamp(28px,8vw,42px);font-weight:500;
  font-variant-numeric:tabular-nums;color:var(--brass);
}
.readout .deg small{font-size:.42em;color:var(--ivory-dim);margin-left:.12em}
.readout .mountain{
  font-size:clamp(15px,4.4vw,19px);color:var(--ivory);
  margin-top:5px;letter-spacing:.3em;text-indent:.3em;
}
.readout .sitting{
  font-size:clamp(11.5px,3.2vw,13px);color:rgba(239,226,196,.52);
  margin-top:7px;letter-spacing:.16em;text-indent:.16em;
}

/* ══════════════════════════════════════
   5 · 提示与按钮
   ══════════════════════════════════════ */
.note{
  font-size:12.5px;line-height:1.65;text-align:center;max-width:32em;
  color:rgba(239,226,196,.55);min-height:1.65em;
}
.note b{color:var(--brass);font-weight:500}

button{
  font:inherit;font-size:15px;letter-spacing:.2em;text-indent:.2em;
  color:var(--lacquer);background:linear-gradient(180deg,var(--brass),var(--gold));
  border:0;border-radius:2px;padding:13px 30px;cursor:pointer;
  box-shadow:0 3px 14px rgba(180,144,60,.3);
}
button:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
button:active{transform:translateY(1px)}
button:disabled{opacity:.35;pointer-events:none}

.ghost{
  background:none;color:var(--ivory-dim);box-shadow:none;
  border:1px solid rgba(224,190,106,.4);
}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.actions button{padding:11px 24px;font-size:14px}

/* ══════════════════════════════════════
   6 · 遮罩与对话框
   ══════════════════════════════════════ */
.gate,.modal{
  position:fixed;inset:0;z-index:9;
  background:rgba(23,17,14,.95);backdrop-filter:blur(3px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:26px 22px;text-align:center;overflow-y:auto;
}
.gate h1{
  font-size:clamp(24px,7.5vw,34px);font-weight:500;
  letter-spacing:.5em;text-indent:.5em;color:var(--ivory);
}
.gate p{font-size:13px;line-height:1.8;color:rgba(239,226,196,.58);max-width:26em}

.modal .ask{
  font-size:clamp(19px,5.4vw,24px);line-height:1.6;color:var(--ivory);max-width:14em;
}
.modal .hint{font-size:13px;line-height:1.8;color:rgba(239,226,196,.5);max-width:24em}
.modal .choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* ══════════════════════════════════════
   7 · 生辰输入
   ══════════════════════════════════════ */
.birth{
  width:100%;max-width:21em;
  display:flex;flex-direction:column;gap:11px;
  padding:16px;border:1px solid rgba(224,190,106,.25);border-radius:3px;
  background:rgba(0,0,0,.22);
}
.birth .row{display:flex;gap:8px;align-items:center}
.birth .row > span{
  flex:0 0 3.4em;text-align:right;
  font-size:13px;color:var(--ivory-dim);letter-spacing:.06em;
}
.birth .opt{color:rgba(239,226,196,.38);font-size:11.5px}

input[type="text"],input[type="number"],input[type="date"],input[type="time"]{
  font:inherit;font-size:15px;color:var(--ivory);
  background:rgba(0,0,0,.32);border:1px solid rgba(224,190,106,.35);
  border-radius:2px;padding:10px 11px;flex:1 1 auto;min-width:0;
}
input[type="date"],input[type="time"]{color-scheme:dark}
input:focus{outline:none;border-color:var(--brass)}
input::placeholder{color:rgba(239,226,196,.3)}

select{
  font:inherit;font-size:14px;color:var(--ivory);
  background:rgba(0,0,0,.32);border:1px solid rgba(224,190,106,.35);
  border-radius:2px;padding:9px 8px;
}

.bazi{
  font-size:12.5px;line-height:1.9;color:rgba(239,226,196,.62);
  letter-spacing:.06em;min-height:1.9em;
}
.bazi b{color:var(--brass);font-weight:500}
.bazi .pillars{
  font-size:15px;letter-spacing:.5em;text-indent:.5em;color:var(--ivory);
}

/* ══════════════════════════════════════
   8 · 第三幕 · 版面
   ══════════════════════════════════════ */
#act3{justify-content:flex-start;gap:7px}

.tabs{
  width:100%;max-width:680px;display:flex;gap:6px;
  overflow-x:auto;padding-bottom:2px;
}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:0 0 auto;padding:7px 14px;font-size:13px;
  letter-spacing:.08em;text-indent:.08em;
  background:none;color:var(--ivory-dim);box-shadow:none;
  border:1px solid rgba(224,190,106,.28);
}
.tabs button[aria-pressed="true"]{
  background:rgba(224,190,106,.16);color:var(--ivory);border-color:var(--brass);
}
.tabs .add{color:var(--brass);border-style:dashed}

.house{
  width:100%;max-width:680px;
  display:flex;flex-wrap:wrap;gap:4px 14px;
  align-items:baseline;justify-content:space-between;
  font-size:12.5px;color:rgba(239,226,196,.6);letter-spacing:.06em;
}
.house b{color:var(--brass);font-weight:500;font-variant-numeric:tabular-nums}
.house .type{
  color:var(--ivory);border-bottom:1px solid rgba(224,190,106,.4);padding-bottom:1px;
}

.canvas-wrap{
  position:relative;width:100%;max-width:680px;flex:1 1 auto;min-height:0;
  border:1px solid rgba(224,190,106,.22);border-radius:3px;
  background:rgba(0,0,0,.18);overflow:hidden;
}
#plan{display:block;width:100%;height:100%;touch-action:none}

/* 北针：随坐向旋转，指出真北在图上的方位 */
.rose{position:absolute;top:10px;right:10px;width:48px;height:48px;pointer-events:none}
.rose svg{width:100%;height:100%;display:block}

.measure{
  width:100%;max-width:680px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
  padding:9px;border:1px solid rgba(224,190,106,.3);border-radius:3px;
  background:rgba(0,0,0,.25);
}
.measure .who{font-size:13px;color:var(--ivory-dim);letter-spacing:.06em}
.measure input{width:7em;padding:8px 10px;font-size:14px;flex:0 0 auto}
.measure button{padding:8px 16px;font-size:13px}

.plan-tools,.chips{
  width:100%;max-width:680px;
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
}
.plan-tools button{padding:9px 14px;font-size:13px;letter-spacing:.08em;text-indent:.08em}
.plan-tools .mode[aria-pressed="true"]{
  background:linear-gradient(180deg,var(--brass),var(--gold));
  color:var(--lacquer);border-color:transparent;
}
.chips button{
  padding:6px 11px;font-size:12.5px;
  background:none;color:var(--ivory-dim);box-shadow:none;
  border:1px solid rgba(224,190,106,.3);
}
.chips button[aria-pressed="true"]{
  background:rgba(224,190,106,.16);color:var(--ivory);border-color:var(--brass);
}
</style>
</head>
<body>

<!-- ═══ 第二幕 · 定盘 ═══════════════════ -->
<main class="act" id="act2">
  <div class="plate" id="plate">
    <svg id="dial" viewBox="0 0 400 400" aria-label="罗盘盘面"></svg>
    <svg class="hud" viewBox="0 0 400 400" aria-hidden="true">
      <circle class="track" id="track" cx="200" cy="200" r="193" hidden></circle>
      <circle class="ring"  id="ring"  cx="200" cy="200" r="193"
              transform="rotate(-90 200 200)" hidden></circle>
    </svg>
    <div class="threads"><i class="v"></i><i class="h"></i></div>
    <div class="cursor"></div>
  </div>

  <div class="timer" id="timer"></div>

  <div class="readout">
    <div class="deg" id="deg">—<small>°</small></div>
    <div class="mountain" id="mountain">等待磁场</div>
    <div class="sitting" id="sitting"></div>
  </div>

  <p class="note" id="note"></p>

  <div class="actions">
    <button id="lockNow" hidden>立即定盘</button>
    <button id="again" class="ghost" hidden>重新定盘</button>
    <button id="confirmStance" hidden>确认站位</button>
  </div>
</main>

<!-- ═══ 第三幕 · 格局图 ═════════════════ -->
<section class="act" id="act3" hidden>
  <div class="tabs" id="tabs"></div>

  <div class="house">
    <span id="houseType">—</span>
    <span id="houseArea">尚未标注尺寸</span>
  </div>

  <div class="canvas-wrap">
    <canvas id="plan"></canvas>
    <div class="rose">
      <svg viewBox="0 0 60 60" aria-label="北针">
        <circle cx="30" cy="30" r="27" fill="rgba(23,17,14,.55)" stroke="rgba(224,190,106,.35)"/>
        <g id="roseNeedle">
          <path d="M30 8 L35 30 L30 26 L25 30 Z" fill="#A32B1E"/>
          <path d="M30 52 L25 30 L30 34 L35 30 Z" fill="rgba(239,226,196,.5)"/>
          <text x="30" y="20" text-anchor="middle" font-size="9" fill="#E0BE6A"
                font-family="Helvetica Neue, Arial, sans-serif">N</text>
        </g>
      </svg>
    </div>
  </div>

  <div class="measure" id="measure" hidden>
    <span class="who" id="measureWho">这道墙</span>
    <input type="number" id="measureLen" inputmode="decimal" step="0.01" min="0" placeholder="长度">
    <select id="measureUnit">
      <option value="m">米</option>
      <option value="ft">英尺</option>
    </select>
    <button id="measureOk">记下</button>
    <button class="ghost" id="measureClear">清除</button>
  </div>

  <div class="chips" id="chips" hidden></div>

  <div class="plan-tools">
    <button class="mode ghost" data-mode="wall"    aria-pressed="true">墙</button>
    <button class="mode ghost" data-mode="measure" aria-pressed="false">尺寸</button>
    <button class="mode ghost" data-mode="door"    aria-pressed="false">大门</button>
    <button class="mode ghost" data-mode="label"   aria-pressed="false">房间</button>
    <button class="ghost" id="undo">撤销</button>
    <button class="ghost" id="clear">清空本页</button>
  </div>

  <p class="note" id="planNote"></p>
</section>

<!-- ═══ 对话框 ═════════════════════════ -->
<div class="modal" id="stanceModal" hidden>
  <p class="ask">是否面对大门，脸朝外？</p>
  <p class="hint">背对屋内，身体与门框平行，手机端平齐胸。这一步决定整间屋的坐向，站错则后续全错。</p>
  <div class="choices">
    <button class="ghost" id="stanceNo">不是</button>
    <button id="stanceYes">是</button>
  </div>
</div>

<div class="modal" id="pageModal" hidden>
  <p class="ask">新增一页</p>
  <input type="text" id="pageName" placeholder="例如：二楼、主卧" maxlength="12" style="max-width:15em">
  <div class="choices">
    <button class="ghost" id="pageFloor">整层</button>
    <button class="ghost" id="pageRoom">单间</button>
  </div>
  <button class="ghost" id="pageCancel">取消</button>
</div>

<!-- ═══ 第一幕 · 开场与生辰 ═════════════ -->
<div class="gate" id="gate">
  <h1>罗盘</h1>
  <p>手机端平齐胸，屏幕朝上，避开电脑、音箱、钢筋与金属桌面。首次使用请握机划几个「8」字校准磁力计。</p>

  <div class="birth">
    <div class="row">
      <span>生日</span>
      <input type="date" id="birthDate" required>
    </div>
    <div class="row">
      <span>时辰</span>
      <input type="time" id="birthTime">
    </div>
    <div class="row">
      <span>性别</span>
      <select id="birthSex" style="flex:1 1 auto">
        <option value="male">男</option>
        <option value="female">女</option>
      </select>
    </div>
    <p class="opt">时辰可不填，命卦只看年份。填了才能排出完整四柱。</p>
    <div class="bazi" id="baziOut"></div>
  </div>

  <button id="start" disabled>开盘</button>
</div>

<script>
'use strict';

/* ══════════════════════════════════════
   1 · 常量
   ══════════════════════════════════════ */

const CFG = {
  LOCK_MS   : 10000,   // 定盘倒计时
  WINDOW_MS : 6000,    // 取末六秒样本求平均
  TILT_MAX  : 12,      // 允许的最大倾斜度数
  OUTLIER   : 20,      // 离群值判定阈值
  SMOOTH    : 0.12,    // 盘面跟随的低通系数
  MAX_KEEP  : 600,     // 样本队列上限
  RING_R    : 193,     // 进度环半径
};
CFG.RING_LEN = 2 * Math.PI * CFG.RING_R;

const PLAN = {
  WORLD    : 600,      // 画布虚拟坐标边长
  GRID     : 20,       // 网格间距
  SNAP_PT  : 14,       // 端点吸附半径
  SNAP_DEG : 10,       // 拉直吸附角度
  MIN_LEN  : 12,       // 一道墙的最短长度
  HIT      : 14,       // 选墙的命中半径
  DOOR_Y   : 40,       // 大门基准线在虚拟坐标中的高度
};

/* 单位换算：内部一律存米，此表只管显示 */
const UNITS = {
  m  : {label:'米',   per: 1,      area:'㎡'},
  ft : {label:'英尺', per: 0.3048, area:'ft²'},
};

/* 二十四山：由子山起，顺时针每山十五度 */
const MOUNTAINS = ['子','癸','丑','艮','寅','甲','卯','乙','辰','巽','巳','丙',
                   '午','丁','未','坤','申','庚','酉','辛','戌','乾','亥','壬'];
const CARDINAL  = new Set(['子','午','卯','酉']);

/* 八卦八方：坎起正北，每卦四十五度 */
const TRIGRAMS  = [['坎','北'],['艮','东北'],['震','东'],['巽','东南'],
                   ['离','南'],['坤','西南'],['兑','西'],['乾','西北']];

/* 四正方位：中英并列 */
const COMPASS   = [['北','N'],['东','E'],['南','S'],['西','W']];

/* 房间标签 */
const ROOMS = ['客厅','餐厅','厨房','主卧','次卧','书房','卫生间','阳台','玄关'];

/* 八宅：坐山所属之卦决定宅之东西四 */
const EAST_HOUSE = new Set(['坎','离','震','巽']);

/* 八宅宅名，以坐山之卦为名 */
const HOUSE_NAME = {
  坎:'坎宅', 离:'离宅', 震:'震宅', 巽:'巽宅',
  乾:'乾宅', 坤:'坤宅', 艮:'艮宅', 兑:'兑宅',
};

/* 干支 */
const STEMS   = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const BRANCHES= ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

/* 十二时辰起始钟点，子时跨日 */
const HOUR_BRANCH = ['子','丑','丑','寅','寅','卯','卯','辰','辰','巳','巳','午',
                     '午','未','未','申','申','酉','酉','戌','戌','亥','亥','子'];

/* 命卦对应之卦名；五在男为坤、在女为艮，另行处理 */
const LIFE_GUA = {1:'坎', 2:'坤', 3:'震', 4:'巽', 6:'乾', 7:'兑', 8:'艮', 9:'离'};

/* ══════════════════════════════════════
   2 · DOM
   ══════════════════════════════════════ */

const $ = {
  act2     : document.getElementById('act2'),
  act3     : document.getElementById('act3'),
  plate    : document.getElementById('plate'),
  dial     : document.getElementById('dial'),
  ring     : document.getElementById('ring'),
  track    : document.getElementById('track'),
  timer    : document.getElementById('timer'),
  deg      : document.getElementById('deg'),
  mountain : document.getElementById('mountain'),
  sitting  : document.getElementById('sitting'),
  note     : document.getElementById('note'),
  lockNow  : document.getElementById('lockNow'),
  again    : document.getElementById('again'),
  confirm  : document.getElementById('confirmStance'),
  gate     : document.getElementById('gate'),
  start    : document.getElementById('start'),

  birthDate: document.getElementById('birthDate'),
  birthTime: document.getElementById('birthTime'),
  birthSex : document.getElementById('birthSex'),
  baziOut  : document.getElementById('baziOut'),

  stance   : document.getElementById('stanceModal'),
  stanceYes: document.getElementById('stanceYes'),
  stanceNo : document.getElementById('stanceNo'),

  pageModal : document.getElementById('pageModal'),
  pageName  : document.getElementById('pageName'),
  pageFloor : document.getElementById('pageFloor'),
  pageRoom  : document.getElementById('pageRoom'),
  pageCancel: document.getElementById('pageCancel'),

  tabs     : document.getElementById('tabs'),
  canvas   : document.getElementById('plan'),
  houseType: document.getElementById('houseType'),
  houseArea: document.getElementById('houseArea'),
  needle   : document.getElementById('roseNeedle'),
  chips    : document.getElementById('chips'),
  undo     : document.getElementById('undo'),
  clear    : document.getElementById('clear'),
  planNote : document.getElementById('planNote'),

  measure     : document.getElementById('measure'),
  measureWho  : document.getElementById('measureWho'),
  measureLen  : document.getElementById('measureLen'),
  measureUnit : document.getElementById('measureUnit'),
  measureOk   : document.getElementById('measureOk'),
  measureClear: document.getElementById('measureClear'),
};

/* ══════════════════════════════════════
   3 · 角度工具
   ══════════════════════════════════════ */

/** 两角之差，收敛到 -180…180，避免跨越 0° 时算错 */
const delta = (a, b) => ((a - b + 540) % 360) - 180;

/** 归一到 0…360 */
const norm = a => (a % 360 + 360) % 360;

/** 圆周平均：算术平均在 359°/1° 处会失效，须走单位向量 */
function circularMean(list){
  let x = 0, y = 0;
  for (const s of list){
    const r = s.heading * Math.PI / 180;
    x += Math.cos(r); y += Math.sin(r);
  }
  return norm(Math.atan2(y, x) * 180 / Math.PI);
}

/** 先求均值，剔除离群值后再求一次，抵消手抖与偶发晃动 */
function robustMean(list){
  if (!list.length) return null;
  const first  = circularMean(list);
  const keep   = list.filter(s => Math.abs(delta(s.heading, first)) <= CFG.OUTLIER);
  const enough = keep.length >= Math.max(5, list.length * 0.4);
  return enough ? circularMean(keep) : first;
}

/* 方位换算 */
const mountainOf = d => MOUNTAINS[Math.floor(norm(d + 7.5)  / 15)];
const trigramOf  = d => TRIGRAMS [Math.floor(norm(d + 22.5) / 45)];
const compassOf  = d => COMPASS  [Math.floor(norm(d + 45)   / 90)];

/* ══════════════════════════════════════
   4 · 八宅
   ══════════════════════════════════════

   宅之东西四以坐山定，非以向定。
   面朝大门量得的是向，坐 = 向 + 180°。
   ══════════════════════════════════════ */

function houseOf(facing){
  if (facing === null || facing === undefined) return null;

  const sitting = norm(facing + 180);
  const [gua, dir] = trigramOf(sitting);
  const east = EAST_HOUSE.has(gua);

  return {
    facing,
    sitting,
    gua,
    dir,
    name : HOUSE_NAME[gua],
    group: east ? '东四宅' : '西四宅',
    sitMountain : mountainOf(sitting),
    facMountain : mountainOf(facing),
  };
}

/* ══════════════════════════════════════
   5 · 命卦与四柱
   ══════════════════════════════════════

   精度边界：立春以每年 2 月 3 日或 4 日近似，准确到日不到时刻。
   要精确到时刻需引入天文历表，属另一量级的工程。
   月柱与日柱采通行算法，日界以子时换日。
   ══════════════════════════════════════ */

/** 该年立春日期（近似）。1900–2100 间，多数年份为 2 月 4 日 */
function lichunDay(year){
  const early = [1897,1901,1905,1909,1913,1917,1921,1925,1929,1933,1937,
                 1941,1945,1949,1953,1957,1961,1965,1969,1973,1977,1981,
                 1985,1989,1993,1997,2021,2025,2029,2033,2037,2041,2045,
                 2049,2053,2057,2061,2065,2069,2073,2077,2081,2085,2089];
  return early.includes(year) ? 3 : 4;
}

/** 命理年：立春前算前一年 */
function solarYear(date){
  const y = date.getFullYear();
  const m = date.getMonth() + 1;
  const d = date.getDate();
  if (m > 2) return y;
  if (m === 2 && d >= lichunDay(y)) return y;
  return y - 1;
}

/** 命卦。男逆行女顺行，五男作坤、五女作艮 */
function lifeGua(year, sex){
  let n;
  if (sex === 'male'){
    n = (10 - (year % 9)) % 9;
    if (n === 0) n = 9;
    /* 2000 年后男命另起，通行做法为 (9 - (year%9)) */
    if (year >= 2000){
      n = (9 - (year % 9)) % 9;
      if (n === 0) n = 9;
    }
  } else {
    n = ((year % 9) + 5) % 9;
    if (n === 0) n = 9;
    if (year >= 2000){
      n = ((year % 9) + 6) % 9;
      if (n === 0) n = 9;
    }
  }

  const gua = n === 5 ? (sex === 'male' ? '坤' : '艮') : LIFE_GUA[n];
  return {
    num  : n,
    gua,
    group: EAST_HOUSE.has(gua) ? '东四命' : '西四命',
  };
}

/** 年柱干支，以命理年推 */
function yearPillar(year){
  const stem   = STEMS[(year - 4 + 6000) % 10];
  const branch = BRANCHES[(year - 4 + 6000) % 12];
  return stem + branch;
}

/** 各月节气起始日（近似）。索引 0 为立春，即寅月 */
const TERM_DAY = [4, 6, 5, 5, 6, 6, 7, 8, 8, 8, 7, 6];

/** 月柱。以节气分月，非以初一 */
function monthPillar(date, yearStem){
  const m = date.getMonth() + 1;
  const d = date.getDate();

  /* 求节气月序：寅月为 0 */
  let idx = (m + 9) % 12;                 // 2月→0, 3月→1 …
  if (d < TERM_DAY[idx]) idx = (idx + 11) % 12;

  const branch = BRANCHES[(idx + 2) % 12];  // 寅起
  /* 五虎遁：甲己之年丙作首 */
  const startStem = [2, 4, 6, 8, 0][yearStem % 5];
  const stem = STEMS[(startStem + idx) % 10];
  return stem + branch;
}

/** 日柱。以 1900-01-01 为甲戌日起算 */
function dayPillar(date){
  const base = Date.UTC(1900, 0, 1);
  const here = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
  const days = Math.round((here - base) / 86400000);
  const stem   = STEMS[(days + 10) % 10];
  const branch = BRANCHES[(days + 10) % 12];
  return {text: stem + branch, stemIdx: (days + 10) % 10};
}

/** 时柱。五鼠遁：甲己还加甲 */
function hourPillar(hour, dayStemIdx){
  const branch = HOUR_BRANCH[hour];
  const bIdx   = BRANCHES.indexOf(branch);
  const startStem = [0, 2, 4, 6, 8][dayStemIdx % 5];
  const stem = STEMS[(startStem + bIdx) % 10];
  return stem + branch;
}

/** 四柱。无时辰则时柱留空 */
function fourPillars(date, hasTime){
  const sy = solarYear(date);
  const yp = yearPillar(sy);
  const yearStemIdx = STEMS.indexOf(yp[0]);
  const mp = monthPillar(date, yearStemIdx);
  const dp = dayPillar(date);
  const hp = hasTime ? hourPillar(date.getHours(), dp.stemIdx) : null;

  return {solarYear: sy, year: yp, month: mp, day: dp.text, hour: hp};
}

/* ══════════════════════════════════════
   6 · 状态与数据模型
   ══════════════════════════════════════

   project
     ├ v        结构版本，日后升级靠它判断要不要迁移
     ├ facing   第二幕定盘所得的向度
     ├ birth    {date, time, sex} 原样保存，命卦与四柱皆由此推
     ├ unit     显示单位；长度内部一律存米
     ├ active   当前页索引
     └ pages[]  每页一层楼或一个房间
          ├ id / name / kind
          ├ walls[]  {id, a:{x,y}, b:{x,y}, len}   len 为米，未标注则 null
          ├ labels[] {x, y, text}
          ├ door     {x, y} 或 null
          └ trail[]  操作栈，供撤销
   ══════════════════════════════════════ */

const state = {
  raw       : 0,      // 传感器最新方位
  shown     : 0,      // 平滑后的显示方位
  tilt      : 0,      // 当前偏离水平的角度
  live      : false,  // 是否已收到数据
  locked    : false,  // 是否已定盘
  absolute  : false,  // 是否有绝对方位可用
  startedAt : 0,      // 本轮采样起点
  samples   : [],     // {t, heading, tilt}
};

const ui = {
  mode     : 'wall',
  room     : ROOMS[0],
  selected : null,    // 尺寸模式下选中的墙 id
};

let project = newProject();

function uid(){ return Math.random().toString(36).slice(2, 9); }

function newPage(name, kind){
  return {id: uid(), name, kind, walls: [], labels: [], door: null, trail: []};
}

function newProject(){
  return {
    v: 2, facing: null, birth: null, unit: 'm', active: 0,
    pages: [newPage('一楼', 'floor')],
  };
}

const page = () => project.pages[project.active];

/* ══════════════════════════════════════
   7 · 存储层
   ══════════════════════════════════════

   落盘用 localStorage，写入防抖 300 毫秒，避免拖动时狂写。
   存储不可用（隐私模式、内嵌沙箱）时静默退回纯内存。
   ══════════════════════════════════════ */

const store = (() => {
  const KEY = 'luopan.project.v2';
  let usable = true;
  try {
    localStorage.setItem(KEY + '.probe', '1');
    localStorage.removeItem(KEY + '.probe');
  } catch { usable = false; }

  let timer = null;

  return {
    usable,
    save(data){
      if (!usable) return;
      clearTimeout(timer);
      timer = setTimeout(() => {
        try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
      }, 300);
    },
    load(){
      if (!usable) return null;
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        return data && data.v === 2 && Array.isArray(data.pages) ? data : null;
      } catch { return null; }
    },
  };
})();

function persist(){ store.save(project); }

/* ══════════════════════════════════════
   8 · 盘面绘制
   ══════════════════════════════════════ */

const NS = 'http://www.w3.org/2000/svg';

function svg(tag, attrs){
  const node = document.createElementNS(NS, tag);
  for (const key in attrs) node.setAttribute(key, attrs[key]);
  return node;
}

const spin = angle => `rotate(${angle} 200 200)`;

/** 把文字排在半径 r 处，字身沿半径朝外 */
function radialText(text, r, size, fill, angle, extra = {}){
  const node = svg('text', Object.assign({
    x: 200, y: (200 - r) + size * 0.35,
    'text-anchor': 'middle', 'font-size': size,
    fill, transform: spin(angle),
  }, extra));
  node.textContent = text;
  return node;
}

function drawDial(){
  const f = document.createDocumentFragment();

  /* 盘底 */
  const defs = svg('defs');
  const grad = svg('radialGradient', {id:'wood', cx:'.5', cy:'.42', r:'.72'});
  grad.append(
    svg('stop', {offset:'0',   'stop-color':'#F3E8CD'}),
    svg('stop', {offset:'.68', 'stop-color':'#E2D0A6'}),
    svg('stop', {offset:'1',   'stop-color':'#C8B183'}));
  defs.append(grad);
  f.append(defs, svg('circle', {cx:200, cy:200, r:198, fill:'url(#wood)'}));

  /* 层间分界 */
  for (const r of [198,152,110,84,60])
    f.append(svg('circle', {cx:200, cy:200, r, fill:'none',
                            stroke:'#8A6E3E', 'stroke-width':.9}));

  /* 第一层 · 二十四山 */
  MOUNTAINS.forEach((name, i) => {
    const a = i * 15;
    f.append(svg('line', {x1:200, y1:2, x2:200, y2:48,
                          stroke:'#8A6E3E', 'stroke-width':.8, transform:spin(a - 7.5)}));
    f.append(radialText(name, 175, 17, CARDINAL.has(name) ? '#A32B1E' : '#22190F', a));
  });

  /* 第二层 · 八卦，四隅另注方位 */
  TRIGRAMS.forEach(([gua, dir], i) => {
    const a = i * 45;
    f.append(svg('line', {x1:200, y1:50, x2:200, y2:90,
                          stroke:'#8A6E3E', 'stroke-width':.8, transform:spin(a - 22.5)}));
    f.append(radialText(gua, 137, 15, '#8C2318', a));
    if (i % 2) f.append(radialText(dir, 119, 8.5, '#7A6234', a));
  });

  /* 第三层 · 周天三百六十度 */
  for (let a = 0; a < 360; a += 5){
    const major = a % 30 === 0;
    f.append(svg('line', {x1:200, y1:88, x2:200, y2: major ? 100 : 95,
                          stroke: major ? '#22190F' : '#9C845A',
                          'stroke-width': major ? 1 : .6, transform:spin(a)}));
    if (major) f.append(radialText(String(a), 94, 7.5, '#7A6234', a));
  }

  /* 第四层 · 四正方位，中英并列 */
  COMPASS.forEach(([zh, en], i) => {
    const a = i * 90;
    f.append(svg('line', {x1:200, y1:116, x2:200, y2:140, stroke:'#A32B1E',
                          'stroke-width':1.1, 'stroke-opacity':.45, transform:spin(a)}));
    f.append(radialText(zh, 76, 13, '#A32B1E', a));
    f.append(radialText(en, 66, 8, '#7A6234', a,
                        {'font-family':'Helvetica Neue, Arial, sans-serif',
                         'letter-spacing':.6}));
  });

  /* 天池 · 磁针 */
  f.append(svg('circle', {cx:200, cy:200, r:60, fill:'#F5EBD4',
                          stroke:'#8A6E3E', 'stroke-width':.9}));
  f.append(svg('circle', {cx:200, cy:200, r:60, fill:'none',
                          stroke:'#000', 'stroke-opacity':.07, 'stroke-width':6}));
  f.append(svg('path', {d:'M200 152 L207 200 L200 248 L193 200 Z', fill:'#22190F'}));
  f.append(svg('path', {d:'M200 152 L207 200 L193 200 Z', fill:'#A32B1E'}));
  f.append(svg('circle', {cx:200, cy:200, r:4.6, fill:'#B4903C',
                          stroke:'#22190F', 'stroke-width':.8}));
  const cap = svg('text', {x:200, y:232, 'text-anchor':'middle',
                           'font-size':9, fill:'#9C845A', 'letter-spacing':2});
  cap.textContent = '天池';
  f.append(cap);

  $.dial.append(f);
}

/* ══════════════════════════════════════
   9 · 第一幕 · 生辰
   ══════════════════════════════════════ */

function readBirth(){
  const d = $.birthDate.value;
  if (!d) return null;
  return {date: d, time: $.birthTime.value || null, sex: $.birthSex.value};
}

function analyseBirth(birth){
  if (!birth) return null;

  const [y, m, day] = birth.date.split('-').map(Number);
  let hh = 0, mm = 0;
  if (birth.time){
    const parts = birth.time.split(':').map(Number);
    hh = parts[0] || 0; mm = parts[1] || 0;
  }
  const dt = new Date(y, m - 1, day, hh, mm);
  if (Number.isNaN(dt.getTime())) return null;

  const pillars = fourPillars(dt, Boolean(birth.time));
  const gua = lifeGua(pillars.solarYear, birth.sex);
  return {pillars, gua};
}

function renderBirth(){
  const birth = readBirth();
  $.start.disabled = !birth;

  if (!birth){
    $.baziOut.textContent = '请先填生日';
    return;
  }

  const res = analyseBirth(birth);
  if (!res){ $.baziOut.textContent = '日期无法辨识'; return; }

  const {pillars: p, gua} = res;
  const shown = [p.year, p.month, p.day, p.hour || '——'].join(' ');
  const tail  = p.hour ? '' : '<br>时辰未填，时柱未定';

  $.baziOut.innerHTML =
    `<div class="pillars">${shown}</div>`
    + `命卦 <b>${gua.num} ${gua.gua}</b> · <b>${gua.group}</b>${tail}`;
}

   10 · 第二幕 · 画面更新

function renderReadout(){
  const d = norm(state.shown);
  const [gua, dir] = trigramOf(d);
  const [, en] = compassOf(d);

  $.deg.innerHTML        = d.toFixed(1) + '<small>°</small>';
  $.mountain.textContent = `${mountainOf(d)}山 · ${gua}卦 ${dir} ${en}`;
  $.sitting.textContent  = `坐 ${mountainOf(norm(d + 180))} 向 ${mountainOf(d)}`;
}

function renderCountdown(msLeft){
  const secs = Math.ceil(msLeft / 1000);
  $.ring.style.strokeDasharray  = CFG.RING_LEN;
  $.ring.style.strokeDashoffset = CFG.RING_LEN * (1 - msLeft / CFG.LOCK_MS);
  $.timer.innerHTML =
    (state.tilt > CFG.TILT_MAX ? '请将手机端平' : '请固定方向') + ` <b>${secs}</b>`;
}

function showCountdown(on){
  $.ring.hidden = $.track.hidden = !on;
  if (!on) $.timer.textContent = '';
}

/* ══════════════════════════════════════
   11 · 传感器
   ══════════════════════════════════════ */

function readSample(heading, beta, gamma){
  if (state.locked || heading === null || Number.isNaN(heading)) return;

  /* 屏幕朝上平放时 beta、gamma 皆近零，两者合成即偏离水平的角度。
     倾斜会放大方位补偿误差，故标记出来，事后剔除。 */
  state.tilt = Math.hypot(beta || 0, gamma || 0);
  $.plate.classList.toggle('tilted', state.tilt > CFG.TILT_MAX);

  const screenAngle =
    (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  state.raw = norm(heading + screenAngle);

  if (!state.live){
    state.live      = true;
    state.startedAt = performance.now();
    state.shown     = state.raw;
    $.lockNow.hidden = false;
    showCountdown(true);
  }

  state.samples.push({t: performance.now(), heading: state.raw, tilt: state.tilt});
  if (state.samples.length > CFG.MAX_KEEP)
    state.samples.splice(0, state.samples.length - CFG.MAX_KEEP);
}

/* 绝对方位：Android 首选 */
function onAbsolute(e){
  state.absolute = true;
  if (e.alpha !== null) readSample(360 - e.alpha, e.beta, e.gamma);
}

/* 相对方位：仅在没有绝对方位时才用。
   相对方位靠陀螺仪积分，会持续漂移，两路混用会让盘面一直转。 */
function onRelative(e){
  if (state.absolute) return;
  if (typeof e.webkitCompassHeading === 'number')          // iOS
    readSample(e.webkitCompassHeading, e.beta, e.gamma);
  else if (e.absolute === true && e.alpha !== null)
    readSample(360 - e.alpha, e.beta, e.gamma);
}

function attachSensors(){
  window.addEventListener('deviceorientationabsolute', onAbsolute, true);
  window.addEventListener('deviceorientation', onRelative, true);
}

function detachSensors(){
  window.removeEventListener('deviceorientationabsolute', onAbsolute, true);
  window.removeEventListener('deviceorientation', onRelative, true);
}

/* ══════════════════════════════════════
   12 · 定盘
   ══════════════════════════════════════ */

/** 优先取端平时的样本；不足则退回全部近期样本 */
function pickSamples(){
  const now    = performance.now();
  const recent = state.samples.filter(s => now - s.t <= CFG.WINDOW_MS);
  const level  = recent.filter(s => s.tilt <= CFG.TILT_MAX);
  if (level.length >= 8) return level;
  if (recent.length)     return recent;
  return state.samples;
}

function lockPlate(){
  if (state.locked) return;
  state.locked = true;
  detachSensors();                    // 摘掉监听，读数从此不可能再动

  const pool = pickSamples();
  const mean = robustMean(pool);
  if (mean !== null) state.shown = state.raw = mean;

  $.dial.style.transform = `rotate(${-state.shown}deg)`;
  $.plate.classList.add('locked');
  $.plate.classList.remove('tilted');
  showCountdown(false);
  $.lockNow.hidden = true;
  $.again.hidden   = false;
  $.confirm.hidden = false;           // 定盘之后才可确认站位

  const h = houseOf(state.shown);
  $.note.innerHTML =
    `已定盘，取 ${pool.length} 笔样本平均。此宅为 <b>${h.name}</b> · <b>${h.group}</b>。`;
  renderReadout();
}

function restart(){
  state.locked  = false;
  state.live    = false;              // 重新等第一笔数据，倒数才从头开始
  state.samples = [];
  $.plate.classList.remove('locked');
  $.again.hidden   = true;
  $.confirm.hidden = true;
  $.note.innerHTML = '重新采样中，请端平勿动。';
  attachSensors();
}

/* ══════════════════════════════════════
   13 · 主循环
   ══════════════════════════════════════ */

function frame(){
  requestAnimationFrame(frame);
  if (state.locked) return;

  /* 沿最短路径逼近目标角，避免跨越 0° 时整圈回弹 */
  state.shown += delta(state.raw, state.shown) * CFG.SMOOTH;
  $.dial.style.transform = `rotate(${-state.shown}deg)`;
  renderReadout();

  if (!state.live) return;

  const left = CFG.LOCK_MS - (performance.now() - state.startedAt);
  if (left <= 0) lockPlate();
  else renderCountdown(left);
}

/* ══════════════════════════════════════
   14 · 手动转盘（无传感器时的退路）
   ══════════════════════════════════════ */

function enableDialDrag(){
  let last = null;

  const angleAt = ev => {
    const box = $.plate.getBoundingClientRect();
    return Math.atan2(ev.clientY - (box.top  + box.height / 2),
                      ev.clientX - (box.left + box.width  / 2)) * 180 / Math.PI;
  };

  $.plate.addEventListener('pointerdown', ev => {
    if (state.live || state.locked) return;
    last = angleAt(ev);
    $.plate.setPointerCapture(ev.pointerId);
  });

  $.plate.addEventListener('pointermove', ev => {
    if (last === null) return;
    const now   = angleAt(ev);
    state.raw   = norm(state.raw + delta(now, last));
    state.shown = state.raw;
    last = now;
  });

  for (const type of ['pointerup','pointercancel'])
    $.plate.addEventListener(type, () => { last = null; });
}

  $.needle.setAttribute('transform', `rotate(${-h.facing} 30 30)`);

  let text = `<span class="type">${h.name} · ${h.group}</span>`
           + ` 坐<b>${h.sitMountain}</b>向<b>${h.facMountain}</b>`;

  const res = project.birth ? analyseBirth(project.birth) : null;
  if (res){
    const match = res.gua.group.slice(0, 2) === h.group.slice(0, 2);
    text += ` · 命卦<b>${res.gua.gua}</b>${match ? '相配' : '不配'}`;
  }
  $.houseType.innerHTML = text;
}

function renderTabs(){
  $.tabs.textContent = '';

  project.pages.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.textContent = p.name;
    btn.setAttribute('aria-pressed', String(i === project.active));
    btn.addEventListener('click', () => {
      if (i === project.active && project.pages.length > 1){
        if (confirm(`删除「${p.name}」这一页？`)) removePage(i);
        return;
      }
      project.active = i;
      ui.selected = null;
      renderTabs();
      refreshPlan();
      persist();
    });
    $.tabs.append(btn);
  });

  const add = document.createElement('button');
  add.className = 'add';
  add.textContent = '＋ 新页';
  add.addEventListener('click', openPageModal);
  $.tabs.append(add);
}

function openPageModal(){
  $.pageName.value = '';
  $.pageModal.hidden = false;
  setTimeout(() => $.pageName.focus(), 50);
}

function addPage(kind){
  const fallback = kind === 'floor' ? `第${project.pages.length + 1}层` : '房间';
  const name = ($.pageName.value || '').trim() || fallback;
  project.pages.push(newPage(name, kind));
  project.active = project.pages.length - 1;
  ui.selected = null;
  $.pageModal.hidden = true;
  renderTabs();
  refreshPlan();
  persist();
}

function removePage(i){
  project.pages.splice(i, 1);
  project.active = Math.max(0, i - 1);
  renderTabs();
  refreshPlan();
  persist();
}

/* ══════════════════════════════════════
   17 · 画布基础
   ══════════════════════════════════════ */

const ctx  = $.canvas.getContext('2d');
const view = {scale: 1, ox: 0, oy: 0};

function resizeCanvas(){
  const box = $.canvas.getBoundingClientRect();
  if (!box.width || !box.height) return;

  const dpr = window.devicePixelRatio || 1;
  $.canvas.width  = Math.round(box.width  * dpr);
  $.canvas.height = Math.round(box.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  /* 虚拟坐标居中铺满，改变窗口尺寸不会挪动已画的墙 */
  view.scale = Math.min(box.width, box.height) / PLAN.WORLD;
  view.ox = (box.width  - PLAN.WORLD * view.scale) / 2;
  view.oy = (box.height - PLAN.WORLD * view.scale) / 2;

  drawPlan();
}

const toScreen = p => ({x: p.x * view.scale + view.ox, y: p.y * view.scale + view.oy});
const toWorld  = (sx, sy) => ({x: (sx - view.ox) / view.scale,
                               y: (sy - view.oy) / view.scale});

function pointerWorld(ev){
  const box = $.canvas.getBoundingClientRect();
  return toWorld(ev.clientX - box.left, ev.clientY - box.top);
}

/* ══════════════════════════════════════
   18 · 吸附
   ══════════════════════════════════════ */

const snapToGrid = p => ({
  x: Math.round(p.x / PLAN.GRID) * PLAN.GRID,
  y: Math.round(p.y / PLAN.GRID) * PLAN.GRID,
});

/** 落点若靠近已有墙端点，直接咬合过去，房间才不会有缝 */
function snapToEndpoint(p){
  let best = null, bestDist = PLAN.SNAP_PT;
  for (const w of page().walls){
    for (const end of [w.a, w.b]){
      const d = Math.hypot(end.x - p.x, end.y - p.y);
      if (d < bestDist){ bestDist = d; best = end; }
    }
  }
  return best ? {x: best.x, y: best.y} : null;
}

/** 接近水平或垂直时自动拉直 */
function snapOrtho(from, to){
  const angle = Math.abs(Math.atan2(to.y - from.y, to.x - from.x) * 180 / Math.PI);
  if (angle < PLAN.SNAP_DEG || angle > 180 - PLAN.SNAP_DEG) return {x: to.x, y: from.y};
  if (Math.abs(angle - 90) < PLAN.SNAP_DEG)                 return {x: from.x, y: to.y};
  return to;
}

/** 靠近大门基准线时也吸上去，方便从门口起笔 */
function snapDoorLine(p){
  return Math.abs(p.y - PLAN.DOOR_Y) <= PLAN.SNAP_PT
    ? {x: p.x, y: PLAN.DOOR_Y} : null;
}

function resolvePoint(p, from){
  const onEnd = snapToEndpoint(p);
  if (onEnd) return onEnd;

  const straight = snapToGrid(from ? snapOrtho(from, p) : p);
  const onDoor = snapDoorLine(straight);
  return onDoor || straight;
}

/* ══════════════════════════════════════
   19 · 几何：比例尺、闭合环、面积
   ══════════════════════════════════════ */

const pixelLen = w => Math.hypot(w.b.x - w.a.x, w.b.y - w.a.y);

/** 由已标注的墙反推比例尺（米 / 像素）。取中位数，抗单笔误输。 */
function pageScale(p){
  const ratios = p.walls
    .filter(w => w.len > 0 && pixelLen(w) > 1)
    .map(w => w.len / pixelLen(w))
    .sort((a, b) => a - b);
  if (!ratios.length) return null;
  return ratios[Math.floor(ratios.length / 2)];
}

/** 端点建图。坐标已吸附到网格，四舍五入即可当作同一点。 */
function buildGraph(walls){
  const nodes = new Map();
  const key = q => `${Math.round(q.x)}:${Math.round(q.y)}`;

  for (const w of walls){
    const ka = key(w.a), kb = key(w.b);
    if (ka === kb) continue;
    if (!nodes.has(ka)) nodes.set(ka, {p: {...w.a}, nb: new Set()});
    if (!nodes.has(kb)) nodes.set(kb, {p: {...w.b}, nb: new Set()});
    nodes.get(ka).nb.add(kb);
    nodes.get(kb).nb.add(ka);
  }
  return nodes;
}

/** 顺时针夹角，用来在岔路口挑最外侧那条边 */
function turnAngle(from, at, to){
  const base = Math.atan2(from.y - at.y, from.x - at.x);
  const next = Math.atan2(to.y   - at.y, to.x   - at.x);
  let d = base - next;
  while (d <= 0) d += Math.PI * 2;
  return d;
}

/**
 * 沿外圈走一圈。起点取最左（并列取最上），必落在外轮廓上；
 * 每到一个岔口都挑最外侧的边，于是绕出的就是外墙，内部隔墙不会干扰。
 * 有断头墙（度数小于 2）代表尚未闭合，直接放弃。
 */
function outerRing(walls){
  const g = buildGraph(walls);
  if (g.size < 3) return null;
  for (const n of g.values()) if (n.nb.size < 2) return null;

  let startKey = null;
  for (const [k, n] of g){
    if (!startKey){ startKey = k; continue; }
    const s = g.get(startKey).p;
    if (n.p.x < s.x || (n.p.x === s.x && n.p.y < s.y)) startKey = k;
  }

  const ring = [];
  const origin = g.get(startKey).p;
  let prev = {x: origin.x, y: origin.y - 1};   // 虚拟上方点，保证首步朝外
  let curKey = startKey;

  const guard = walls.length * 4 + 8;
  for (let i = 0; i < guard; i++){
    const cur = g.get(curKey);
    ring.push(cur.p);

    let bestKey = null, best = Infinity;
    for (const nk of cur.nb){
      const d = turnAngle(prev, cur.p, g.get(nk).p);
      if (d < best){ best = d; bestKey = nk; }
    }
    if (!bestKey) return null;

    prev   = cur.p;
    curKey = bestKey;
    if (curKey === startKey) return ring.length >= 3 ? ring : null;
  }
  return null;
}

/** 鞋带公式 */
function ringArea(ring){
  let sum = 0;
  for (let i = 0; i < ring.length; i++){
    const a = ring[i], b = ring[(i + 1) % ring.length];
    sum += a.x * b.y - b.x * a.y;
  }
  return Math.abs(sum) / 2;
}

/** 一页的实际面积，单位平方米；条件不足回传 null */
function pageArea(p){
  const scale = pageScale(p);
  const ring  = outerRing(p.walls);
  if (!scale || !ring) return null;
  return ringArea(ring) * scale * scale;
}

/* 单位换算：内部米，显示按 project.unit */
const toDisplay = m  => m / UNITS[project.unit].per;
const toMetres  = v  => v * UNITS[project.unit].per;
const fmtLen    = m  => `${toDisplay(m).toFixed(2)} ${UNITS[project.unit].label}`;
const fmtArea   = m2 => `${(m2 / (UNITS[project.unit].per ** 2)).toFixed(1)} ${UNITS[project.unit].area}`;

/* ══════════════════════════════════════
   20 · 绘制
   ══════════════════════════════════════ */

let preview = null;   // 拖动中的墙

function drawPlan(){
  const box = $.canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, box.width, box.height);

  drawGrid();
  drawDoorLine();
  drawRingFill();
  drawWalls();
  drawPreview();
  drawDoor();
  drawLabels();
}

function drawGrid(){
  ctx.save();
  ctx.strokeStyle = 'rgba(224,190,106,.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let v = 0; v <= PLAN.WORLD; v += PLAN.GRID){
    const a = toScreen({x: v, y: 0}), b = toScreen({x: v, y: PLAN.WORLD});
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    const c = toScreen({x: 0, y: v}), d = toScreen({x: PLAN.WORLD, y: v});
    ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y);
  }
  ctx.stroke();
  ctx.restore();
}

/**
 * 大门基准线：画布上方一道朱红门槛，标出向度。
 * 用户面朝大门外测得向度，故画布上方即屋外，由此线往下画即屋内。
 */
function drawDoorLine(){
  const h = houseOf(project.facing);
  if (!h) return;

  const box = $.canvas.getBoundingClientRect();
  const y = toScreen({x: 0, y: PLAN.DOOR_Y}).y;
  const left  = toScreen({x: 40,  y: 0}).x;
  const right = toScreen({x: PLAN.WORLD - 40, y: 0}).x;

  ctx.save();

  /* 门槛线 */
  ctx.strokeStyle = 'rgba(163,43,30,.85)';
  ctx.lineWidth = 3;
  ctx.setLineDash([12, 7]);
  ctx.beginPath();
  ctx.moveTo(left, y); ctx.lineTo(right, y);
  ctx.stroke();
  ctx.setLineDash([]);

  /* 朝外箭头 */
  const mid = (left + right) / 2;
  ctx.fillStyle = 'rgba(163,43,30,.9)';
  ctx.beginPath();
  ctx.moveTo(mid, y - 26);
  ctx.lineTo(mid - 7, y - 14);
  ctx.lineTo(mid + 7, y - 14);
  ctx.closePath();
  ctx.fill();

  /* 标注 */
  const [, dir] = trigramOf(h.facing);
  const [, en] = compassOf(h.facing);
  ctx.fillStyle = 'rgba(239,226,196,.9)';
  ctx.font = '12px "Songti SC", "Noto Serif SC", serif';
  ctx.textAlign = 'center';
  ctx.fillText(`大门朝 ${h.facMountain} ${h.facing.toFixed(0)}° ${dir}${en} 屋外`, mid, y - 32);

  /* 屋内提示，仅在还没画墙时出现 */
  if (!page().walls.length){
    ctx.fillStyle = 'rgba(239,226,196,.32)';
    ctx.font = '13px "Songti SC", serif';
    ctx.fillText('由此线往下画即屋内', mid, y + 26);
  }

  ctx.restore();
  void box;
}

/** 外墙闭合时淡淡填一层，让人一眼看出已经围起来了 */
function drawRingFill(){
  const ring = outerRing(page().walls);
  if (!ring) return;
  ctx.save();
  ctx.fillStyle = 'rgba(224,190,106,.07)';
  ctx.beginPath();
  ring.forEach((p, i) => {
    const s = toScreen(p);
    i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y);
  });
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawWalls(){
  const scale = pageScale(page());

  for (const w of page().walls){
    const a = toScreen(w.a), b = toScreen(w.b);
    const chosen = w.id === ui.selected;

    ctx.save();
    ctx.strokeStyle = chosen ? '#E0BE6A' : '#E8DCC0';
    ctx.lineWidth   = chosen ? 6 : 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.restore();

    /* 标注长度：自己填的用亮色，比例尺推算的用暗色 */
    const shown = w.len ? w.len : (scale ? pixelLen(w) * scale : null);
    if (shown){
      const mid = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
      let angle = Math.atan2(b.y - a.y, b.x - a.x);
      if (angle > Math.PI / 2 || angle < -Math.PI / 2) angle += Math.PI;

      ctx.save();
      ctx.translate(mid.x, mid.y);
      ctx.rotate(angle);
      ctx.font = '11px "Helvetica Neue", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = w.len ? 'rgba(224,190,106,.95)' : 'rgba(239,226,196,.4)';
      ctx.fillText(fmtLen(shown), 0, -7);
      ctx.restore();
    }
  }

  /* 墙角点，看得出接得上没有 */
  ctx.save();
  ctx.fillStyle = 'rgba(224,190,106,.75)';
  for (const w of page().walls){
    for (const end of [w.a, w.b]){
      const s = toScreen(end);
      ctx.beginPath();
      ctx.arc(s.x, s.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawPreview(){
  if (!preview) return;
  ctx.save();
  ctx.strokeStyle = '#E0BE6A';
  ctx.lineWidth = 3;
  ctx.setLineDash([7, 5]);
  const a = toScreen(preview.a), b = toScreen(preview.b);
  ctx.beginPath();
  ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
  ctx.stroke();
  ctx.restore();
}

function drawDoor(){
  if (!page().door) return;
  const s = toScreen(page().door);
  ctx.save();
  ctx.strokeStyle = '#A32B1E';
  ctx.fillStyle   = '#A32B1E';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(s.x, s.y, 9, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(s.x, s.y, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.font = '11px "Songti SC", serif';
  ctx.textAlign = 'center';
  ctx.fillText('大门', s.x, s.y + 24);
  ctx.restore();
}

function drawLabels(){
  ctx.save();
  ctx.fillStyle = 'rgba(239,226,196,.82)';
  ctx.font = '13px "Songti SC", "Noto Serif SC", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const l of page().labels){
    const s = toScreen(l);
    ctx.fillText(l.text, s.x, s.y);
  }
  ctx.restore();
}

/* ══════════════════════════════════════
   21 · 交互
   ══════════════════════════════════════ */

let dragFrom = null;

/** 点到线段的距离，用来选墙 */
function distToWall(p, w){
  const dx = w.b.x - w.a.x, dy = w.b.y - w.a.y;
  const len2 = dx * dx + dy * dy;
  if (!len2) return Math.hypot(p.x - w.a.x, p.y - w.a.y);
  let t = ((p.x - w.a.x) * dx + (p.y - w.a.y) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (w.a.x + t * dx), p.y - (w.a.y + t * dy));
}

function wallAt(p){
  let best = null, bestDist = PLAN.HIT;
  for (const w of page().walls){
    const d = distToWall(p, w);
    if (d < bestDist){ bestDist = d; best = w; }
  }
  return best;
}

function onPlanDown(ev){
  const p = pointerWorld(ev);

  if (ui.mode === 'measure'){
    const w = wallAt(p);
    ui.selected = w ? w.id : null;
    openMeasure(w);
    drawPlan();
    return;
  }

  if (ui.mode === 'door'){
    page().door = resolvePoint(p, null);
    page().trail.push({type: 'door'});
    afterEdit();
    return;
  }

  if (ui.mode === 'label'){
    page().labels.push({x: p.x, y: p.y, text: ui.room});
    page().trail.push({type: 'label'});
    afterEdit();
    return;
  }

  dragFrom = resolvePoint(p, null);
  $.canvas.setPointerCapture(ev.pointerId);
}

function onPlanMove(ev){
  if (!dragFrom) return;
  preview = {a: dragFrom, b: resolvePoint(pointerWorld(ev), dragFrom)};
  drawPlan();
}

function onPlanUp(ev){
  if (!dragFrom) return;
  const end = resolvePoint(pointerWorld(ev), dragFrom);
  if (Math.hypot(end.x - dragFrom.x, end.y - dragFrom.y) >= PLAN.MIN_LEN){
    page().walls.push({id: uid(), a: dragFrom, b: end, len: null});
    page().trail.push({type: 'wall'});
  }
  dragFrom = null;
  preview  = null;
  afterEdit();
}

function undoLast(){
  const last = page().trail.pop();
  if (!last) return;
  if (last.type === 'wall')  page().walls.pop();
  if (last.type === 'label') page().labels.pop();
  if (last.type === 'door')  page().door = null;
  ui.selected = null;
  closeMeasure();
  afterEdit();
}

function clearPage(){
  const p = page();
  p.walls = []; p.labels = []; p.door = null; p.trail = [];
  ui.selected = null;
  closeMeasure();
  afterEdit();
}

/* ══════════════════════════════════════
   22 · 尺寸标注
   ══════════════════════════════════════ */

function openMeasure(w){
  if (!w){ closeMeasure(); return; }
  $.measure.hidden = false;
  $.measureWho.textContent = w.len ? '改这道墙' : '这道墙长';
  $.measureLen.value = w.len ? toDisplay(w.len).toFixed(2) : '';
  $.measureUnit.value = project.unit;
  setTimeout(() => $.measureLen.focus(), 50);
}

function closeMeasure(){ $.measure.hidden = true; }

function commitMeasure(){
  const w = page().walls.find(x => x.id === ui.selected);
  if (!w) return closeMeasure();

  const val = parseFloat($.measureLen.value);
  if (!(val > 0)) return;

  project.unit = $.measureUnit.value;
  w.len = toMetres(val);
  closeMeasure();
  ui.selected = null;
  afterEdit();
}

function clearMeasure(){
  const w = page().walls.find(x => x.id === ui.selected);
  if (w) w.len = null;
  closeMeasure();
  ui.selected = null;
  afterEdit();
}

/* ══════════════════════════════════════
   23 · 界面刷新
   ══════════════════════════════════════ */

function setMode(mode){
  ui.mode = mode;
  ui.selected = null;
  closeMeasure();
  for (const btn of document.querySelectorAll('.mode'))
    btn.setAttribute('aria-pressed', String(btn.dataset.mode === mode));
  $.chips.hidden = mode !== 'label';
  drawPlan();
  updateNote();
}

function updateNote(){
  const tips = {
    wall   : '从上方朱红门槛线起笔，按住拖动画墙。',
    measure: '点一道墙，填它的实际长度。填一道就够，其余自动推算。',
    door   : '点一下大门所在的位置。',
    label  : '先选房间名，再点它在图上的位置。',
  };
  const storage = store.usable ? '已自动保存' : '本次有效，关掉分页不留';
  $.planNote.innerHTML = `${tips[ui.mode]} <b>${storage}</b>`;
}

function updateArea(){
  const p = page();
  const scale = pageScale(p);
  const ring  = outerRing(p.walls);

  if (!scale){
    $.houseArea.textContent = p.walls.length ? '标一道墙的长度即可算面积' : '尚未标注尺寸';
    return;
  }
  if (!ring){
    $.houseArea.textContent = '外墙尚未闭合';
    return;
  }

  const here = ringArea(ring) * scale * scale;

  /* 有多层时一并给出总和 */
  const floors = project.pages.filter(x => x.kind === 'floor');
  const areas  = floors.map(pageArea).filter(a => a !== null);
  const total  = areas.reduce((s, a) => s + a, 0);

  $.houseArea.innerHTML = (floors.length > 1 && areas.length > 1)
    ? `本页 <b>${fmtArea(here)}</b> · 全屋 <b>${fmtArea(total)}</b>`
    : `本页 <b>${fmtArea(here)}</b>`;
}

function refreshPlan(){
  drawPlan();
  updateArea();
  updateNote();
}

function afterEdit(){
  refreshPlan();
  persist();
}

function buildChips(){
  for (const name of ROOMS){
    const btn = document.createElement('button');
    btn.textContent = name;
    btn.setAttribute('aria-pressed', String(name === ui.room));
    btn.addEventListener('click', () => {
      ui.room = name;
      for (const other of $.chips.children)
        other.setAttribute('aria-pressed', String(other === btn));
    });
    $.chips.append(btn);
  }
}

/* ══════════════════════════════════════
   24 · 启动
   ══════════════════════════════════════ */

async function requestPermissionIfNeeded(){
  const DOE = window.DeviceOrientationEvent;
  if (!DOE || typeof DOE.requestPermission !== 'function') return true;   // 非 iOS
  try {
    return await DOE.requestPermission() === 'granted';
  } catch {
    return true;                      // 权限接口异常时仍尝试监听
  }
}

async function begin(){
  const birth = readBirth();
  if (!birth) return;
  project.birth = birth;
  persist();

  $.gate.hidden = true;

  if (!await requestPermissionIfNeeded()){
    $.note.textContent =
      '未授予方向感应权限。可在 设置 › Safari › 动作与方向 中开启后重进。';
    return;
  }

  attachSensors();
  requestAnimationFrame(frame);

  setTimeout(() => {
    if (state.live) return;
    $.mountain.textContent = '未读到磁场';
    $.note.innerHTML = '这台设备没有回传磁力计数据。请确认网址是 <b>https</b> 开头，'
                     + '并检查系统定位服务是否开启。眼下可用手指转动盘面手动定向。';
  }, 2500);
}

/** 有存档且已定过坐向，直接续上第三幕 */
function resumeIfSaved(){
  const saved = store.load();
  if (!saved) return false;

  project = saved;
  if (project.active >= project.pages.length) project.active = 0;

  if (project.birth){
    $.birthDate.value = project.birth.date || '';
    $.birthTime.value = project.birth.time || '';
    $.birthSex.value  = project.birth.sex  || 'male';
  }
  if (project.facing === null) return false;

  $.gate.hidden = true;
  $.act2.hidden = true;
  $.act3.hidden = false;
  renderHouse();
  renderTabs();
  resizeCanvas();
  refreshPlan();
  return true;
}

drawDial();
enableDialDrag();
buildChips();
setMode('wall');

for (const el of [$.birthDate, $.birthTime, $.birthSex])
  el.addEventListener('change', renderBirth);
$.birthDate.addEventListener('input', renderBirth);

$.start.addEventListener('click', begin);
$.lockNow.addEventListener('click', lockPlate);
$.again.addEventListener('click', restart);
$.confirm.addEventListener('click', askStance);
$.stanceYes.addEventListener('click', enterAct3);
$.stanceNo.addEventListener('click', backToAct2);

$.pageFloor.addEventListener('click', () => addPage('floor'));
$.pageRoom.addEventListener('click', () => addPage('room'));
$.pageCancel.addEventListener('click', () => { $.pageModal.hidden = true; });

$.canvas.addEventListener('pointerdown', onPlanDown);
$.canvas.addEventListener('pointermove', onPlanMove);
$.canvas.addEventListener('pointerup', onPlanUp);
$.canvas.addEventListener('pointercancel', onPlanUp);

$.undo.addEventListener('click', undoLast);
$.clear.addEventListener('click', clearPage);

$.measureOk.addEventListener('click', commitMeasure);
$.measureClear.addEventListener('click', clearMeasure);
$.measureLen.addEventListener('keydown', e => { if (e.key === 'Enter') commitMeasure(); });
$.measureUnit.addEventListener('change', () => {
  project.unit = $.measureUnit.value;
  afterEdit();
});

for (const btn of document.querySelectorAll('.mode'))
  btn.addEventListener('click', () => setMode(btn.dataset.mode));

window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

resumeIfSaved();
renderBirth();
</script>
</body>
</html>
