<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#17110E">
<title>罗盘</title>
<style>
/* ══════════════════════════════════════
   1 · 设计变量
   ══════════════════════════════════════ */
:root{
  --lacquer:#17110E;
  --ivory:#EFE2C4;
  --ivory-dim:#D6C193;
  --cinnabar:#A32B1E;
  --gold:#B4903C;
  --brass:#E0BE6A;
}

/* ══════════════════════════════════════
   2 · 基础版式
   ══════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 34%, #2A1F17 0%, var(--lacquer) 62%);
  color:var(--ivory);
  font-family:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC",serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,2.4vh,20px);
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
  overflow:hidden;touch-action:none;
}
[hidden]{display:none!important}

/* ══════════════════════════════════════
   3 · 盘面
   ══════════════════════════════════════ */
.plate{
  position:relative;
  width:min(90vw,52vh);height:min(90vw,52vh);
  flex:0 0 auto;
}
.plate::after{                       /* 盘边木框 */
  content:"";position:absolute;inset:-2.4%;border-radius:50%;
  background:linear-gradient(150deg,#4A3524,#241812 55%,#3D2B1C);
  box-shadow:0 14px 40px rgba(0,0,0,.65), inset 0 0 0 1px rgba(224,190,106,.28);
  z-index:-1;
}
.plate.locked::after{
  box-shadow:0 14px 40px rgba(0,0,0,.65), inset 0 0 0 1.5px rgba(224,190,106,.75);
}
#dial{width:100%;height:100%;display:block;will-change:transform}

/* 倒数进度环：覆盖在盘上，不随盘转 */
.hud{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hud .track{fill:none;stroke:rgba(23,17,14,.22);stroke-width:5}
.hud .ring{fill:none;stroke:var(--brass);stroke-width:5;stroke-linecap:round;transition:stroke .25s}
.plate.tilted .hud .ring{stroke:var(--cinnabar)}

/* 天心十道：固定不动，代表手机所指 */
.threads{position:absolute;inset:0;pointer-events:none}
.threads i{position:absolute;background:rgba(224,190,106,.55)}
.threads .v{
  left:50%;top:-1.5%;bottom:-1.5%;width:1px;transform:translateX(-.5px);
  background:linear-gradient(180deg,var(--cinnabar) 0 46%,rgba(224,190,106,.5) 46%);
}
.threads .h{top:50%;left:-1.5%;right:-1.5%;height:1px;transform:translateY(-.5px)}
.cursor{
  position:absolute;left:50%;top:-3.6%;width:0;height:0;transform:translateX(-50%);
  border-left:8px solid transparent;border-right:8px solid transparent;
  border-top:13px solid var(--cinnabar);
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));
}

/* ══════════════════════════════════════
   4 · 倒数与读数
   ══════════════════════════════════════ */
.timer{
  display:flex;align-items:baseline;gap:.6em;min-height:1.4em;
  font-size:clamp(15px,4.4vw,19px);color:var(--ivory-dim);
  letter-spacing:.2em;text-indent:.2em;
}
.timer b{
  font-size:clamp(30px,8.5vw,42px);font-weight:500;letter-spacing:0;
  font-variant-numeric:tabular-nums;color:var(--brass);
}
.plate.tilted ~ .timer,
.plate.tilted ~ .timer b{color:var(--cinnabar)}

.readout{text-align:center;line-height:1.15}
.readout .deg{
  font-size:clamp(30px,8.5vw,44px);font-weight:500;
  font-variant-numeric:tabular-nums;color:var(--brass);
}
.readout .deg small{font-size:.42em;color:var(--ivory-dim);margin-left:.12em}
.readout .mountain{
  font-size:clamp(16px,4.6vw,20px);color:var(--ivory);
  margin-top:5px;letter-spacing:.32em;text-indent:.32em;
}
.readout .sitting{
  font-size:clamp(11.5px,3.2vw,13px);color:rgba(239,226,196,.52);
  margin-top:7px;letter-spacing:.16em;text-indent:.16em;
}

/* ══════════════════════════════════════
   5 · 提示与按钮
   ══════════════════════════════════════ */
.note{
  font-size:12.5px;line-height:1.65;text-align:center;max-width:30em;
  color:rgba(239,226,196,.55);min-height:1.65em;
}
.note b{color:var(--brass);font-weight:500}

button{
  font:inherit;font-size:15px;letter-spacing:.2em;text-indent:.2em;
  color:var(--lacquer);background:linear-gradient(180deg,var(--brass),var(--gold));
  border:0;border-radius:2px;padding:13px 30px;cursor:pointer;
  box-shadow:0 3px 14px rgba(180,144,60,.3);
}
button:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
button:active{transform:translateY(1px)}
.actions button{padding:11px 26px;font-size:14px}
.actions .ghost{
  background:none;color:var(--ivory-dim);box-shadow:none;
  border:1px solid rgba(224,190,106,.4);
}

/* ══════════════════════════════════════
   6 · 开场遮罩
   ══════════════════════════════════════ */
.gate{
  position:fixed;inset:0;z-index:9;
  background:rgba(23,17,14,.94);backdrop-filter:blur(3px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;padding:28px;text-align:center;
}
.gate h1{
  font-size:clamp(26px,8vw,36px);font-weight:500;
  letter-spacing:.5em;text-indent:.5em;color:var(--ivory);
}
.gate p{font-size:13.5px;line-height:1.8;color:rgba(239,226,196,.58);max-width:26em}
</style>
</head>
<body>

<div class="plate" id="plate">
  <svg id="dial" viewBox="0 0 400 400" aria-label="罗盘盘面"></svg>
  <svg class="hud" viewBox="0 0 400 400" aria-hidden="true">
    <circle class="track" id="track" cx="200" cy="200" r="193" hidden></circle>
    <circle class="ring"  id="ring"  cx="200" cy="200" r="193"
            transform="rotate(-90 200 200)" hidden></circle>
  </svg>
  <div class="threads"><i class="v"></i><i class="h"></i></div>
  <div class="cursor"></div>
</div>

<div class="timer" id="timer"></div>

<div class="readout">
  <div class="deg" id="deg">—<small>°</small></div>
  <div class="mountain" id="mountain">等待磁场</div>
  <div class="sitting" id="sitting"></div>
</div>

<p class="note" id="note"></p>

<div class="actions">
  <button id="lockNow" hidden>立即定盘</button>
  <button id="again" class="ghost" hidden>重新定盘</button>
</div>

<div class="gate" id="gate">
  <h1>罗盘</h1>
  <p>手机端平齐胸，屏幕朝上，避开电脑、音箱、钢筋与金属桌面。首次使用请握机划几个「8」字校准磁力计。站定后十秒内自动定盘。</p>
  <button id="start">开盘</button>
</div>

<script>
'use strict';

/* ══════════════════════════════════════
   1 · 常量
   ══════════════════════════════════════ */

const CFG = {
  LOCK_MS   : 10000,   // 定盘倒计时
  WINDOW_MS : 6000,    // 取末六秒样本求平均
  TILT_MAX  : 12,      // 允许的最大倾斜度数
  OUTLIER   : 20,      // 离群值判定阈值
  SMOOTH    : 0.12,    // 盘面跟随的低通系数
  MAX_KEEP  : 600,     // 样本队列上限
  RING_R    : 193,     // 进度环半径
};
CFG.RING_LEN = 2 * Math.PI * CFG.RING_R;

/* 二十四山：由子山起，顺时针每山十五度 */
const MOUNTAINS = ['子','癸','丑','艮','寅','甲','卯','乙','辰','巽','巳','丙',
                   '午','丁','未','坤','申','庚','酉','辛','戌','乾','亥','壬'];
const CARDINAL  = new Set(['子','午','卯','酉']);

/* 八卦八方：坎起正北，每卦四十五度 */
const TRIGRAMS  = [['坎','北'],['艮','东北'],['震','东'],['巽','东南'],
                   ['离','南'],['坤','西南'],['兑','西'],['乾','西北']];

/* 四正方位：中英并列 */
const COMPASS   = [['北','N'],['东','E'],['南','S'],['西','W']];

/* ══════════════════════════════════════
   2 · DOM
   ══════════════════════════════════════ */

const $ = {
  plate   : document.getElementById('plate'),
  dial    : document.getElementById('dial'),
  ring    : document.getElementById('ring'),
  track   : document.getElementById('track'),
  timer   : document.getElementById('timer'),
  deg     : document.getElementById('deg'),
  mountain: document.getElementById('mountain'),
  sitting : document.getElementById('sitting'),
  note    : document.getElementById('note'),
  lockNow : document.getElementById('lockNow'),
  again   : document.getElementById('again'),
  gate    : document.getElementById('gate'),
  start   : document.getElementById('start'),
};

/* ══════════════════════════════════════
   3 · 角度工具
   ══════════════════════════════════════ */

/** 两角之差，收敛到 -180…180，避免跨越 0° 时算错 */
const delta = (a, b) => ((a - b + 540) % 360) - 180;

/** 归一到 0…360 */
const norm = a => (a % 360 + 360) % 360;

/** 圆周平均：算术平均在 359°/1° 处会失效，须走单位向量 */
function circularMean(list){
  let x = 0, y = 0;
  for (const s of list){
    const r = s.heading * Math.PI / 180;
    x += Math.cos(r); y += Math.sin(r);
  }
  return norm(Math.atan2(y, x) * 180 / Math.PI);
}

/** 先求均值，剔除离群值后再求一次，抵消手抖与偶发晃动 */
function robustMean(list){
  if (!list.length) return null;
  const first  = circularMean(list);
  const keep   = list.filter(s => Math.abs(delta(s.heading, first)) <= CFG.OUTLIER);
  const enough = keep.length >= Math.max(5, list.length * 0.4);
  return enough ? circularMean(keep) : first;
}

/* 方位换算 */
const mountainOf = d => MOUNTAINS[Math.floor(norm(d + 7.5)  / 15)];
const trigramOf  = d => TRIGRAMS [Math.floor(norm(d + 22.5) / 45)];
const compassOf  = d => COMPASS  [Math.floor(norm(d + 45)   / 90)];

/* ══════════════════════════════════════
   4 · 盘面绘制
   ══════════════════════════════════════ */

const NS = 'http://www.w3.org/2000/svg';

function svg(tag, attrs){
  const node = document.createElementNS(NS, tag);
  for (const key in attrs) node.setAttribute(key, attrs[key]);
  return node;
}

const spin = angle => `rotate(${angle} 200 200)`;

/** 把文字排在半径 r 处，字身沿半径朝外 */
function radialText(text, r, size, fill, angle, extra = {}){
  const node = svg('text', Object.assign({
    x: 200, y: (200 - r) + size * 0.35,
    'text-anchor': 'middle', 'font-size': size,
    fill, transform: spin(angle),
  }, extra));
  node.textContent = text;
  return node;
}

function drawDial(){
  const f = document.createDocumentFragment();

  /* 盘底 */
  const defs = svg('defs');
  const grad = svg('radialGradient', {id:'wood', cx:'.5', cy:'.42', r:'.72'});
  grad.append(
    svg('stop', {offset:'0',   'stop-color':'#F3E8CD'}),
    svg('stop', {offset:'.68', 'stop-color':'#E2D0A6'}),
    svg('stop', {offset:'1',   'stop-color':'#C8B183'}));
  defs.append(grad);
  f.append(defs, svg('circle', {cx:200, cy:200, r:198, fill:'url(#wood)'}));

  /* 层间分界 */
  for (const r of [198,152,110,84,60])
    f.append(svg('circle', {cx:200, cy:200, r, fill:'none',
                            stroke:'#8A6E3E', 'stroke-width':.9}));

  /* 第一层 · 二十四山 */
  MOUNTAINS.forEach((name, i) => {
    const a = i * 15;
    f.append(svg('line', {x1:200, y1:2, x2:200, y2:48,
                          stroke:'#8A6E3E', 'stroke-width':.8, transform:spin(a - 7.5)}));
    f.append(radialText(name, 175, 17, CARDINAL.has(name) ? '#A32B1E' : '#22190F', a));
  });

  /* 第二层 · 八卦，四隅另注方位 */
  TRIGRAMS.forEach(([gua, dir], i) => {
    const a = i * 45;
    f.append(svg('line', {x1:200, y1:50, x2:200, y2:90,
                          stroke:'#8A6E3E', 'stroke-width':.8, transform:spin(a - 22.5)}));
    f.append(radialText(gua, 137, 15, '#8C2318', a));
    if (i % 2) f.append(radialText(dir, 119, 8.5, '#7A6234', a));
  });

  /* 第三层 · 周天三百六十度 */
  for (let a = 0; a < 360; a += 5){
    const major = a % 30 === 0;
    f.append(svg('line', {x1:200, y1:88, x2:200, y2: major ? 100 : 95,
                          stroke: major ? '#22190F' : '#9C845A',
                          'stroke-width': major ? 1 : .6, transform:spin(a)}));
    if (major) f.append(radialText(String(a), 94, 7.5,
